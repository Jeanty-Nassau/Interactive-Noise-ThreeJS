<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Noise Field — a procedural Three.js surface driven by simplex noise and moving light.">
  <title>Noise Field — Three.js Study</title>
</head>
<body>
  <main class="study-shell">
    <section class="study-copy">
      <p class="eyebrow">THREE.JS STUDY / 04</p>
      <h1>Noise <span>Field</span></h1>
      <p>A procedural surface driven by coherent noise, animated deformation and moving cobalt/orange light.</p>
      <p class="hint">Move the pointer to shift the field · Scroll to change amplitude.</p>
    </section>

    <div id="canvasContainer">
      <canvas class="webgl" aria-label="Interactive procedural noise field"></canvas>
    </div>

    <aside class="controls-panel" aria-label="Noise controls">
      <strong>Controls</strong>
      <span>pointer / scroll</span>
      <button type="button" data-reset-view>Reset</button>
    </aside>
  </main>
</body>
</html>
